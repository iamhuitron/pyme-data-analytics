[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyme-data-analytics"
version = "1.0.0"
description = "Retail Data Science & Inventory Analytics Engine for Mexican SMEs (RFM, ABC Pareto, Market Basket)"
readme = "README.md"
authors = [{ name = "Miguel Delgado Huitron", email = "ianhuitron0687@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.10.0",
    "pyarrow>=15.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0"
]

[project.scripts]
pyme-analytics = "pyme_analytics.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
